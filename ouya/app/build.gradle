apply plugin: 'com.android.application'

repositories {
    flatDir { dirs 'libs' }   // Crosswalk AAR lives in app/libs
}

android {
    compileSdkVersion 30

    // Release signing — credentials live in keystore.properties (gitignored, not in VCS).
    signingConfigs {
        release {
            def kpFile = rootProject.file('keystore.properties')
            if (kpFile.exists()) {
                def kp = new Properties()
                kp.load(new FileInputStream(kpFile))
                storeFile file(kp['storeFile'])
                storePassword kp['storePassword']
                keyAlias kp['keyAlias']
                keyPassword kp['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.ryo.bitwarsouya'
        minSdkVersion 16            // OUYA = Android 4.1 (Jelly Bean), Tegra 3
        targetSdkVersion 21         // Crosswalk 23 targets 21; keep low to avoid runtime-permission model
        versionCode 3
        versionName '1.0'           // versionCode 3: keep literal res paths so the store can extract ouya_icon.png
        ndk {
            // OUYA is armv7 only; drop the 58MB x86 lib from the AAR -> single ~40MB APK
            abiFilters 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false          // the legacy Crosswalk AAR trips lint; don't fail the build on it
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation(name: 'xwalk_core_library-23.53.589.4', ext: 'aar')
}
