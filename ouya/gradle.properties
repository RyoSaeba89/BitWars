org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=false
# Keep literal resource paths in the APK (res/drawable-xhdpi/ouya_icon.png):
# the OUYA community store (stouyapi) extracts ouya_icon.png by its literal ZIP
# path, and AAPT2's release-build resource optimization shortens/scrambles them.
android.enableResourceOptimizations=false
